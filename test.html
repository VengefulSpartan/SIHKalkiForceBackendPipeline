<!DOCTYPE html>
<html>
<head>
    <title>KalkiForce OCR Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>KalkiForce OCR Test</h2>
    <input type="file" accept="image/*" capture="camera" id="cameraInput">
    <p id="status">Waiting for image...</p>
    <pre id="result"></pre>

    <script>
        // ⚠️ Replace with your laptop's IP
        const SERVER_URL = "http://192.168.0.194:8000/predict";

        document.getElementById('cameraInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Processing...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64String = reader.result;

                try {
                    const response = await fetch(SERVER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_base64: base64String })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    if (data.data.length === 0) {
                        document.getElementById('result').innerText = "No text detected.";
                    } else {
                        document.getElementById('result').innerText = data.data.map(obj => obj.text).join("\n");
                    }

                    document.getElementById('status').innerText = "Done!";
                } catch (err) {
                    document.getElementById('status').innerText = "Error: " + err;
                }
            };
        });
    </script>
</body>
</html>
